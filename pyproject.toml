[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-clarity"
version = "1.1.0"
description = "Privacy-first, local-only, strictly read-only AWS account visibility and configuration assessment CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Danso" }]
keywords = ["aws", "security", "audit", "readonly", "cloud", "misconfiguration", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "boto3==1.42.66",
  "botocore==1.42.66",
]

[project.urls]
Homepage = "https://github.com/DavidDanso/aws-clarity"
Repository = "https://github.com/DavidDanso/aws-clarity"
Issues = "https://github.com/DavidDanso/aws-clarity/issues"
Changelog = "https://github.com/DavidDanso/aws-clarity/blob/main/CHANGELOG.md"
Security = "https://github.com/DavidDanso/aws-clarity/blob/main/SECURITY.md"

[project.scripts]
aws-clarity = "aws_clarity_cli:main"

[tool.setuptools]
package-dir = { "" = "backend" }
py-modules = ["api_guard", "aws_clarity_cli", "local_engine", "lambda_handler", "utils", "exceptions"]
packages = ["scanner"]
license-files = ["LICENSE"]
