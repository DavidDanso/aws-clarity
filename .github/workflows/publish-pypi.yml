name: Publish Python Package to PyPI (Trusted Publishing)

# Strictly gated OIDC Trusted Publishing workflow (zero long-lived PyPI API tokens).
# Never runs on ordinary branch pushes or pull requests.
# Requires:
#   1. A GitHub Environment named `pypi` with required maintainer approval.
#   2. A matching Trusted Publisher configured on PyPI (`DavidDanso/aws-clarity`,
#      workflow `publish-pypi.yml`, environment `pypi`).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Exact existing release tag matching pyproject.toml (e.g. v1.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build, Test & Validate Distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install dependencies, run unit tests & audit
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt build twine pip-audit
          python -m unittest discover -s backend -p "test_*.py" -v < /dev/null
          pip-audit -r backend/requirements.txt
      - name: Verify tag matches pyproject.toml version and build distributions
        shell: bash
        run: |
          EXPECTED_TAG="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}"
          PKG_VER="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${EXPECTED_TAG}" != "v${PKG_VER}" ]; then
            echo "ERROR: Tag ${EXPECTED_TAG} does not match pyproject.toml version v${PKG_VER}" >&2
            exit 1
          fi
          python -m build --outdir dist-pypi .
          twine check --strict dist-pypi/*
      - name: Upload verified distributions for PyPI publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-distributions
          path: dist-pypi/
          retention-days: 1

  publish-to-pypi:
    name: Publish to PyPI via OIDC Trusted Publishing
    needs: [build-and-verify]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aws-clarity
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-distributions
          path: dist-pypi/
      - name: Publish distributions to PyPI (OIDC, no API token)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist-pypi/
