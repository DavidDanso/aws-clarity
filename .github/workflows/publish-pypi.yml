name: Publish Python Package to PyPI (Trusted Publishing)

# Strictly controlled, manual-dispatch-only OIDC Trusted Publishing workflow
# (zero permanent PyPI API tokens, zero PyPI secrets).
#
# Publishes ONLY the existing verified wheel (.whl) and source distribution
# (.tar.gz) from an already-published GitHub Release after verifying:
#   1. Workflow executes from refs/heads/main only.
#   2. Requested release_tag exists in Git and matches pyproject.toml version.
#   3. Downloaded wheel & sdist pass SHA-256 verification against SHA256SUMS.txt.
#   4. Downloaded wheel & sdist pass GitHub SLSA provenance attestation checks.
#   5. Standalone CLI tarball (aws-clarity-local-*.tar.gz) is excluded from PyPI.
#
# Prerequisites:
#   - GitHub Environment `pypi` configured with owner reviewer & `main` branch policy.
#   - Matching Pending/Trusted Publisher configured on PyPI (`aws-clarity`,
#     `DavidDanso/aws-clarity`, workflow `publish-pypi.yml`, environment `pypi`).
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Exact existing published GitHub release tag (e.g. v1.1.0)"
        required: true
        default: "v1.1.0"
        type: string

permissions:
  contents: read

jobs:
  verify-release-artifacts:
    name: Download & Verify Existing GitHub Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Enforce execution from main branch only
        shell: bash
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "ERROR: publish-pypi.yml must only be dispatched from refs/heads/main (got ${GITHUB_REF})." >&2
            exit 1
          fi
          if ! echo "${{ inputs.release_tag }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: release_tag must match ^vX.Y.Z$ (got '${{ inputs.release_tag }}')." >&2
            exit 1
          fi

      - name: Checkout requested release tag to verify metadata
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Verify tag matches pyproject.toml version and expected commit
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          PKG_NAME="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["name"])')"
          PKG_VER="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          TAG_COMMIT="$(git rev-parse HEAD)"
          echo "Verified tag ${RELEASE_TAG} -> commit ${TAG_COMMIT}, package ${PKG_NAME} ${PKG_VER}"
          if [ "${PKG_NAME}" != "aws-clarity" ]; then
            echo "ERROR: Unexpected package name ${PKG_NAME}" >&2
            exit 1
          fi
          if [ "${RELEASE_TAG}" != "v${PKG_VER}" ]; then
            echo "ERROR: Tag ${RELEASE_TAG} does not match pyproject.toml version v${PKG_VER}" >&2
            exit 1
          fi
          if [ "${RELEASE_TAG}" = "v1.1.0" ] && [ "${TAG_COMMIT}" != "e4633afc1bc978809a352d989c97a16ea099346f" ]; then
            echo "ERROR: Tag v1.1.0 resolved to unexpected commit ${TAG_COMMIT}" >&2
            exit 1
          fi
          echo "PKG_VER=${PKG_VER}" >> "${GITHUB_ENV}"

      - name: Download existing published wheel, sdist & SHA256SUMS.txt from GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p dist-verify dist-pypi
          WHEEL="aws_clarity-${PKG_VER}-py3-none-any.whl"
          SDIST="aws_clarity-${PKG_VER}.tar.gz"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir dist-verify \
            --pattern "${WHEEL}" \
            --pattern "${SDIST}" \
            --pattern "SHA256SUMS.txt"

          # Verify SHA-256 checksums against the published release manifest
          (cd dist-verify && sha256sum -c --ignore-missing SHA256SUMS.txt)

          # Verify GitHub Actions SLSA build provenance attestations
          gh attestation verify "dist-verify/${WHEEL}" --repo "${GITHUB_REPOSITORY}"
          gh attestation verify "dist-verify/${SDIST}" --repo "${GITHUB_REPOSITORY}"

          # Validate distribution metadata with twine check --strict
          python -m pip install --upgrade pip twine
          twine check --strict "dist-verify/${WHEEL}" "dist-verify/${SDIST}"

          # Stage ONLY wheel and sdist for PyPI (strictly excluding standalone tarball & SHA256SUMS.txt)
          cp "dist-verify/${WHEEL}" "dist-verify/${SDIST}" dist-pypi/
          ls -la dist-pypi/
          FILE_COUNT="$(find dist-pypi -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [ "${FILE_COUNT}" != "2" ]; then
            echo "ERROR: Expected exactly 2 PyPI distribution files (wheel + sdist), found ${FILE_COUNT}" >&2
            exit 1
          fi

      - name: Upload verified wheel & sdist for PyPI publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-distributions
          path: dist-pypi/
          retention-days: 1

  publish-to-pypi:
    name: Publish Verified Release to PyPI (OIDC Trusted Publishing)
    needs: [verify-release-artifacts]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aws-clarity
    permissions:
      id-token: write
    steps:
      - name: Download verified wheel & sdist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-distributions
          path: dist-pypi/

      - name: Confirm only wheel and sdist are staged (no standalone tarball)
        shell: bash
        run: |
          ls -la dist-pypi/
          if ls dist-pypi/aws-clarity-local-*.tar.gz >/dev/null 2>&1; then
            echo "ERROR: Standalone archive must not be published to PyPI" >&2
            exit 1
          fi

      - name: Publish distributions to PyPI (OIDC, no API token)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist-pypi/
