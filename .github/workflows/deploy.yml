name: static-frontend-aws-manual

# Manual-only AWS static hosting workflow (S3 + CloudFront).
# AWS Clarity is local-first: there is no hosted scanning backend, API Gateway,
# Lambda, or DynamoDB. GitHub Pages (.github/workflows/pages.yml) is the
# primary zero-cost host; this workflow manages the optional AWS static bridge.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "deploy or destroy"
        required: true
        type: choice
        options:
          - deploy
          - destroy
        default: deploy

# ---------------------------------------------------------------------------
# Least-privilege token permissions
# ---------------------------------------------------------------------------
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  TF_VERSION: "1.15.6"
  NODE_VERSION: "24"

jobs:
  # -------------------------------------------------------------------------
  # 1. BUILD & TEST — verify backend unit tests + static frontend invariants
  # -------------------------------------------------------------------------
  build:
    name: Build & Test
    if: ${{ github.event.inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 #v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend dependencies & run tests
        run: |
          pip install -r backend/requirements.txt
          python3 -m unittest discover -s backend -p "test_*.py" -v

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Lint, build & verify static frontend
        run: |
          cd frontend
          npm ci
          npm run lint
          npm run build
          npm run verify

  # -------------------------------------------------------------------------
  # 2. DEPLOY — Terraform apply (S3 + CloudFront) + S3 sync + CF invalidation
  # -------------------------------------------------------------------------
  deploy:
    needs: build
    name: Deploy Static Frontend
    environment: production
    if: ${{ github.event.inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cloudfront_url: ${{ steps.tf_outputs.outputs.cloudfront_url }}
      s3_bucket_name: ${{ steps.tf_outputs.outputs.s3_bucket_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Cache Terraform providers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: infra/.terraform
          key: terraform-${{ hashFiles('infra/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-

      - name: Terraform Init
        run: terraform -chdir=infra init

      - name: Terraform Validate
        run: terraform -chdir=infra validate

      - name: Terraform Plan
        run: terraform -chdir=infra plan -out=tfplan

      - name: Terraform Apply
        run: terraform -chdir=infra apply tfplan

      - name: Terraform Outputs
        id: tf_outputs
        run: |
          echo "cloudfront_url=$(terraform -chdir=infra output -raw cloudfront_url)" >> $GITHUB_OUTPUT
          echo "cloudfront_distribution_id=$(terraform -chdir=infra output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT
          echo "s3_bucket_name=$(terraform -chdir=infra output -raw s3_bucket_name)" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Build & verify static frontend
        run: |
          cd frontend
          npm ci
          npm run build
          npm run verify

      - name: Sync frontend to S3
        run: |
          aws s3 sync frontend/dist/ s3://${{ steps.tf_outputs.outputs.s3_bucket_name }} --delete
          echo "✅ Frontend deployed to S3"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.tf_outputs.outputs.cloudfront_distribution_id }} \
            --paths "/*"
          echo "✅ CloudFront cache invalidated (${{ steps.tf_outputs.outputs.cloudfront_url }})"

  # -------------------------------------------------------------------------
  # 3. DESTROY — Manual teardown of optional AWS static bridge
  # -------------------------------------------------------------------------
  destroy:
    name: Terraform Destroy
    environment: production-destroy
    if: ${{ github.event.inputs.action == 'destroy' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 #v6.0.3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Cache Terraform providers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: infra/.terraform
          key: terraform-${{ hashFiles('infra/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-

      - name: Terraform Init
        run: terraform -chdir=infra init

      - name: Confirm destroy target
        run: |
          echo "=========================================="
          echo "  DESTROY requested by: ${{ github.actor }}"
          echo "  Run ID: ${{ github.run_id }}"
          echo "  Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "=========================================="

      - name: Terraform Destroy
        run: terraform -chdir=infra destroy -auto-approve -input=false
